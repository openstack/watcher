# Test the failure path of the audit lifecycle.
#
# Uses the actuator strategy with two nop actions, one of which has
# fail_execute=true. Validates that the action plan and the failing
# action reach FAILED state while the other action succeeds.

fixtures:
  - WatcherGabbiFixture

defaults:
  request_headers:
    x-auth-token: fake-token
    x-user-id: bbbbbbbb-1111-2222-3333-444444444444
    x-project-id: aaaaaaaa-1111-2222-3333-444444444444
    x-roles: admin
    content-type: application/json
    accept: application/json

tests:

  - name: create audit with a failing action
    POST: /audits
    data:
      audit_type: ONESHOT
      goal: unclassified
      strategy: actuator
      parameters:
        actions:
          - action_type: nop
            input_parameters:
              message: this action succeeds
          - action_type: nop
            input_parameters:
              message: this action fails
              fail_execute: true
    status: 201
    response_json_paths:
      $.uuid: /^[a-f0-9-]+$/

  - name: wait for audit succeeded
    GET: /audits/$RESPONSE['$.uuid']
    poll:
      count: 300
      delay: 0.1
    status: 200
    response_json_paths:
      $.state: SUCCEEDED

  - name: list action plans for audit
    GET: /action_plans?audit_uuid=$RESPONSE['$.uuid']
    status: 200
    response_json_paths:
      $.action_plans.`len`: 1

  - name: verify action plan recommended
    GET: /action_plans/$RESPONSE['$.action_plans[0].uuid']
    status: 200
    response_json_paths:
      $.state: RECOMMENDED

  - name: list actions for action plan
    GET: /actions?action_plan_uuid=$RESPONSE['$.uuid']
    status: 200
    response_json_paths:
      $.actions.`len`: 2

  - name: trigger action plan
    PATCH: /action_plans/$HISTORY['verify action plan recommended'].$RESPONSE['$.uuid']
    data:
      - op: replace
        path: /state
        value: PENDING
    status: 200

  - name: wait for action plan failed
    GET: /action_plans/$RESPONSE['$.uuid']
    poll:
      count: 300
      delay: 0.1
    status: 200
    response_json_paths:
      $.state: FAILED

  - name: verify action states
    GET: /actions?action_plan_uuid=$RESPONSE['$.uuid']
    poll:
      count: 50
      delay: 0.1
    status: 200
    response_json_paths:
      $.actions.`len`: 2
      $.actions[0].state: SUCCEEDED
      $.actions[1].state: FAILED

  # --- Cleanup: delete action plan and audit ---

  - name: delete action plan
    DELETE: /action_plans/$HISTORY['wait for action plan failed'].$RESPONSE['$.uuid']
    status: 204

  - name: verify action plan deleted
    GET: /action_plans/$HISTORY['wait for action plan failed'].$RESPONSE['$.uuid']
    status: 404

  - name: verify actions deleted with action plan
    GET: /actions?action_plan_uuid=$HISTORY['wait for action plan failed'].$RESPONSE['$.uuid']
    status: 200
    response_json_paths:
      $.actions.`len`: 0

  - name: delete audit
    DELETE: /audits/$HISTORY['wait for audit succeeded'].$RESPONSE['$.uuid']
    status: 204

  - name: verify audit deleted
    GET: /audits/$HISTORY['wait for audit succeeded'].$RESPONSE['$.uuid']
    status: 404
