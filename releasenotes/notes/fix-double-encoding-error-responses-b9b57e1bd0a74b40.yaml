---
upgrade:
  - |
    The ``error_message`` field in API error responses has changed
    format. Previously, ``ParsableErrorMiddleware`` double-encoded
    WSME fault bodies, so ``error_message`` was a JSON-encoded
    string that clients had to parse a second time. It is now a
    JSON object with ``faultcode``, ``faultstring``, and
    ``debuginfo`` keys. Clients that called ``json.loads()`` on the
    ``error_message`` value should access it directly as a dict
    (e.g. ``response['error_message']['faultstring']``). For more
    details, please see
    `Bug #2169114 <https://bugs.launchpad.net/watcher/+bug/2169114>_`.
