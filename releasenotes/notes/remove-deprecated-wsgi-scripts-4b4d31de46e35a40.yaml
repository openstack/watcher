---
upgrade:
  - |
    The deprecated ``watcher/api/app.wsgi`` script has been removed, along
    with the ``watcher-api-wsgi`` script generated by the ``pbr``
    ``wsgi_scripts`` extension, which is itself deprecated and scheduled for
    removal from ``pbr``. The Watcher API is now published exclusively as the
    ``watcher.wsgi.api`` Python module.

    Deployment tooling should reference the ``watcher.wsgi.api:application``
    module path if the chosen WSGI server supports it, as gunicorn and uWSGI
    do:

    .. code-block:: ini

        [uwsgi]
        module = watcher.wsgi.api:application

    Servers that require a file on disk instead, such as Apache
    ``mod_wsgi``, can be pointed at the installed ``watcher/wsgi/api.py``
    module, which exposes the same ``application`` object:

    .. code-block:: apache

        WSGIScriptAlias / /usr/local/lib/python3/dist-packages/watcher/wsgi/api.py
