---
upgrade:
  - |
    The standalone ``watcher-api`` server has been removed, along with its
    console script and manual page. It was built on
    ``oslo_service.wsgi.Server``, which is eventlet based and cannot run
    under the threading service backend. The Watcher API must now be deployed
    as a WSGI application behind a WSGI server such as uwsgi or Apache
    ``mod_wsgi``, using the ``watcher-api-wsgi`` script or the
    ``watcher.wsgi.api:application`` entry point. Deployments that already
    serve the API over uwsgi or mod_wsgi are unaffected.
  - |
    The ``[api] host``, ``[api] port``, ``[api] workers`` and
    ``[api] enable_ssl_api`` configuration options have been removed. They
    were only consumed by the standalone ``watcher-api`` server, which has
    been removed as well. The listen address, listen port, worker count and
    TLS termination are now configured in the WSGI server that serves the
    API. Any of these options left in ``watcher.conf`` are ignored and
    should be dropped.
